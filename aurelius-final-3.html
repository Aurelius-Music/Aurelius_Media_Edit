<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aurelius Editor</title>
<style>
  :root{
    --bg:#121014;
    --surface:#1B181D;
    --surface-2:#242026;
    --line:#332E36;
    --text:#EFEAF0;
    --text-dim:#948C99;
    --accent:#FF3D6E;
    --accent-2:#37E6C4;
    --font-display:'Archivo','Segoe UI',sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overflow-x:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header .brand{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-0.02em;}
  header .brand span{color:var(--accent);}
  .mode-switch{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;}
  .mode-switch button{
    border:none;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:6px;font-family:var(--font-body);
  }
  .mode-switch button.active{background:var(--accent);color:#1a0812;}

  main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(45deg,#19161b 25%,transparent 25%),
      linear-gradient(-45deg,#19161b 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#19161b 75%),
      linear-gradient(-45deg,transparent 75%,#19161b 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0px;
    background-color:#141216;
    position:relative;overflow:hidden;
    min-height:0;
  }
  .stage canvas, .stage video{max-width:100%;max-height:100%;display:block;touch-action:none;}
  #textLayer{position:absolute;inset:0;pointer-events:none;}
  .text-node{
    position:absolute;pointer-events:auto;cursor:grab;font-weight:800;
    font-family:var(--font-display);white-space:nowrap;user-select:none;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }

  .text-node.selected{outline:2px dashed var(--accent-2);outline-offset:4px;}
  .color-swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
  .color-swatch.active{border-color:var(--text);}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .emoji-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:22px;padding:8px 0;}

  .empty-state{
    text-align:center;color:var(--text-dim);padding:32px;
  }
  .empty-state .icon{font-size:40px;margin-bottom:10px;opacity:.6;}
  .empty-state button, .empty-state label{
    margin-top:16px;background:var(--accent);color:#1a0812;border:none;
    padding:12px 22px;border-radius:8px;font-weight:700;font-size:14px;font-family:var(--font-body);
    display:inline-block;cursor:pointer;
  }

  .tray{
    flex-shrink:0;border-top:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;
  }
  .tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{
    flex-shrink:0;background:transparent;border:none;color:var(--text-dim);
    padding:11px 16px;font-size:12.5px;font-weight:600;font-family:var(--font-body);
    border-bottom:2px solid transparent;
  }
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent);}

  .panel{padding:14px 16px 18px;min-height:104px;}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .row:last-child{margin-bottom:0;}
  .row label{width:78px;flex-shrink:0;font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .row input[type=range]{flex:1;accent-color:var(--accent);height:4px;}
  .row .val{width:34px;text-align:right;font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;}

  .swatches{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .swatch-btn{
    flex-shrink:0;width:56px;height:56px;border-radius:10px;border:2px solid transparent;
    background:var(--surface-2);color:var(--text-dim);font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;
  }
  .swatch-btn.active{border-color:var(--accent);color:var(--text);}

  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:20px;font-size:12.5px;font-weight:600;font-family:var(--font-body);
    display:flex;align-items:center;gap:6px;
  }
  .chip.accent{background:var(--accent);color:#1a0812;border-color:var(--accent);}

  .actionbar{
    display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .actionbar button{
    font-family:var(--font-body);border:none;border-radius:9px;font-weight:700;font-size:13.5px;
    padding:12px 0;flex:1;
  }
  .btn-primary{background:var(--accent);color:#1a0812;}
  .btn-ghost{background:var(--surface-2);color:var(--text);flex:0 0 44px;font-size:16px;}

  input[type=file]{display:none;}

  .trim-wrap{position:relative;height:44px;background:var(--surface-2);border-radius:8px;margin-bottom:12px;overflow:hidden;}
  #trimTrack{width:100%;height:100%;display:block;}
  .trim-handle{
    position:absolute;top:0;bottom:0;width:14px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#1a0812;font-size:10px;font-weight:800;
    touch-action:none;
  }
  #handleStart{left:0;border-radius:6px 0 0 6px;}
  #handleEnd{right:0;border-radius:0 6px 6px 0;}
  .trim-shade{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.55);}

  #cropOverlay{position:absolute;inset:0;display:none;z-index:5;}
  #cropOverlay.active{display:block;}
  .crop-box{position:absolute;border:2px solid var(--accent-2);box-shadow:0 0 0 9999px rgba(0,0,0,.6);touch-action:none;}
  .crop-handle{position:absolute;width:22px;height:22px;background:var(--accent-2);border-radius:50%;touch-action:none;}
  .crop-handle[data-corner=nw]{left:-11px;top:-11px;}
  .crop-handle[data-corner=ne]{right:-11px;top:-11px;}
  .crop-handle[data-corner=sw]{left:-11px;bottom:-11px;}
  .crop-handle[data-corner=se]{right:-11px;bottom:-11px;}

  .status-toast{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:rgba(20,18,22,.92);border:1px solid var(--line);color:var(--text);
    padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:600;
    display:none;align-items:center;gap:8px;z-index:20;
  }
  .spinner{width:12px;height:12px;border:2px solid var(--text-dim);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">AURELIUS <span>EDIT</span></div>
    <div class="mode-switch">
      <button id="modePhotoBtn" class="active">Photo</button>
      <button id="modeVideoBtn">Video</button>
    </div>
  </header>

  <main>
    <div class="stage" id="stage">
      <div class="empty-state" id="emptyState">
        <div class="icon">◧</div>
        <div id="emptyLabel">Drop in a photo to start editing</div>
        <label id="emptyPickBtn" for="fileInput">Choose Photo</label>
      </div>
      <canvas id="photoCanvas" style="display:none;"></canvas>
      <video id="videoEl" style="display:none;" playsinline muted></video>
      <canvas id="videoCanvas" style="display:none;"></canvas>
      <div id="textLayer"></div>
      <div id="cropOverlay">
        <div class="crop-box" id="cropBox">
          <div class="crop-handle" data-corner="nw"></div>
          <div class="crop-handle" data-corner="ne"></div>
          <div class="crop-handle" data-corner="sw"></div>
          <div class="crop-handle" data-corner="se"></div>
        </div>
      </div>
      <div class="status-toast" id="statusToast"><div class="spinner"></div><span id="statusText">Working…</span></div>
    </div>

    <div class="tray">
      <div class="tabs" id="photoTabs">
        <button class="ptab active" data-tab="adjust">Adjust</button>
        <button class="ptab" data-tab="refine">Refine</button>
        <button class="ptab" data-tab="filter">Filters</button>
        <button class="ptab" data-tab="style">Style</button>
        <button class="ptab" data-tab="crop">Crop</button>
        <button class="ptab" data-tab="transform">Transform</button>
        <button class="ptab" data-tab="text">Text</button>
        <button class="ptab" data-tab="stickers">Stickers</button>
      </div>
      <div class="tabs" id="videoTabs" style="display:none;">
        <button class="vtab active" data-tab="trim">Trim</button>
        <button class="vtab" data-tab="vfilter">Filters</button>
        <button class="vtab" data-tab="speed">Speed</button>
      </div>

      <div class="panel" id="panelHost"></div>

      <div class="actionbar">
        <button class="btn-ghost" id="resetBtn" title="Reset">↺</button>
        <button class="btn-primary" id="exportBtn">Export</button>
      </div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*">
<input type="file" id="videoInput" accept="video/*">

<script>
(function(){
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), emptyState = $('#emptyState'), emptyLabel = $('#emptyLabel'), emptyPickBtn = $('#emptyPickBtn');
  const photoCanvas = $('#photoCanvas'), pctx = photoCanvas.getContext('2d');
  const videoEl = $('#videoEl'), videoCanvas = $('#videoCanvas'), vctx = videoCanvas.getContext('2d');
  const textLayer = $('#textLayer');
  const fileInput = $('#fileInput'), videoInput = $('#videoInput');
  const panelHost = $('#panelHost');
  const modePhotoBtn = $('#modePhotoBtn'), modeVideoBtn = $('#modeVideoBtn');
  const photoTabs = $('#photoTabs'), videoTabs = $('#videoTabs');
  const statusToast = $('#statusToast'), statusText = $('#statusText');
  const cropOverlay = $('#cropOverlay'), cropBoxEl = $('#cropBox');

  let mode = 'photo';
  let img = null; // HTMLImageElement
  let originalImg = null; // pristine, uncropped source — used to fully undo crop on Reset
  let rotation = 0; // degrees, multiples of 90
  let flipH = false, flipV = false;
  let adjust = { brightness:100, contrast:100, saturate:100, blur:0, vignette:0, sharpen:0, dehaze:0, warmth:0, tint:0, grain:0, bloom:0, chroma:0, frame:'none' };
  let drawPhotoTimer = null;
  let activeFilter = 'none';
  let textNodes = []; // {id, text, x, y, color, size}
  let textIdSeq = 1;

  let videoFile = null;
  let vAdjust = { brightness:100, contrast:100, saturate:100, vignette:0 };
  let vFilter = 'none';
  let trimStart = 0, trimEnd = 0, duration = 0;
  let playbackRate = 1;
  let muteAudio = false;
  let selectedTextId = null;
  const TEXT_FONTS = {
    display: "'Archivo',sans-serif",
    sans: "-apple-system,'Segoe UI',sans-serif",
    serif: "Georgia,serif",
    mono: "'Courier New',monospace"
  };
  const STICKER_EMOJIS = ['😀','😂','😍','🔥','💯','🎉','❤️','✨','🎵','🎤','🚀','💰','👑','⭐','💀','😎','🤔','👀','🙌','💪','🎧','📸','🌴','⚡'];
  let videoDrawLoopId = null;

  const FILTERS = [
    {id:'none', label:'Original', css:''},
    {id:'mono', label:'Mono', css:'grayscale(1) contrast(1.1)'},
    {id:'noir', label:'Noir', css:'grayscale(1) contrast(1.4) brightness(0.9)'},
    {id:'warm', label:'Warm', css:'sepia(0.35) saturate(1.3) brightness(1.05)'},
    {id:'cold', label:'Cold', css:'saturate(1.2) hue-rotate(190deg) brightness(1.05)'},
    {id:'fade', label:'Fade', css:'contrast(0.85) saturate(0.7) brightness(1.1)'},
    {id:'vivid', label:'Vivid', css:'saturate(1.6) contrast(1.15)'},
    {id:'neon', label:'Neon', css:'saturate(1.8) hue-rotate(-15deg) contrast(1.3)'},
    {id:'cinematic', label:'Cinematic', css:'sepia(0.15) hue-rotate(180deg) saturate(1.3) contrast(1.15) brightness(0.98)'},
    {id:'vhs', label:'VHS', css:'saturate(1.5) contrast(1.25) hue-rotate(-8deg) brightness(1.05)'},
    {id:'vintage', label:'Vintage', css:'sepia(0.45) contrast(0.92) brightness(1.05) saturate(0.85)'},
    {id:'sunset', label:'Sunset', css:'sepia(0.3) hue-rotate(-18deg) saturate(1.5) brightness(1.05)'},
    {id:'frost', label:'Frost', css:'saturate(0.55) brightness(1.15) contrast(1.05) hue-rotate(195deg)'},
    {id:'crimson', label:'Crimson', css:'saturate(1.4) hue-rotate(-30deg) contrast(1.2)'},
    {id:'pastel', label:'Pastel', css:'saturate(0.6) brightness(1.15) contrast(0.88)'},
    {id:'punch', label:'Punch B&W', css:'grayscale(1) contrast(1.6)'},
    {id:'golden', label:'Golden Hour', css:'sepia(0.25) saturate(1.3) brightness(1.1) hue-rotate(-10deg)'},
    {id:'matte', label:'Matte', css:'contrast(0.85) brightness(1.05) saturate(0.9)'}
  ];

  function applyVignette(ctx, canvas, amount){
    if(!amount) return;
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;
    const outerR = Math.sqrt(cx*cx+cy*cy);
    const grad = ctx.createRadialGradient(cx,cy, outerR*0.35, cx,cy, outerR);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${(amount/100)*0.85})`);
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }

  function toast(msg, show=true){
    statusText.textContent = msg;
    statusToast.style.display = show ? 'flex' : 'none';
  }

  function filterCSSFromValues(a, filterId){
    const dehaze = a.dehaze || 0;
    const effContrast = a.contrast * (1 + dehaze/100*0.5);
    const effSaturate = a.saturate * (1 + dehaze/100*0.35);
    const effBrightness = a.brightness * (1 - dehaze/100*0.05);
    const base = `brightness(${effBrightness}%) contrast(${effContrast}%) saturate(${effSaturate}%)` + (a.blur?` blur(${a.blur}px)`:'');
    const f = FILTERS.find(x=>x.id===filterId);
    return [base, f && f.css].filter(Boolean).join(' ');
  }

  function applyWarmthTint(ctx, canvas, warmth, tint){
    if(!warmth && !tint) return;
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    if(warmth){
      const alpha = Math.min(Math.abs(warmth)/50, 1) * 0.35;
      ctx.fillStyle = warmth>0 ? `rgba(255,150,40,${alpha})` : `rgba(40,120,255,${alpha})`;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }
    if(tint){
      const alpha = Math.min(Math.abs(tint)/50, 1) * 0.35;
      ctx.fillStyle = tint>0 ? `rgba(255,30,180,${alpha})` : `rgba(30,200,110,${alpha})`;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }
    ctx.restore();
  }

  function applySharpen(ctx, canvas, amount){
    if(!amount) return;
    const w = canvas.width, h = canvas.height;
    if(w<3 || h<3) return;
    const imgData = ctx.getImageData(0,0,w,h);
    const src = imgData.data;
    const out = new Uint8ClampedArray(src);
    const strength = amount/100;
    const center = 1 + 4*strength, side = -strength;
    for(let y=1;y<h-1;y++){
      const rowOff = y*w;
      for(let x=1;x<w-1;x++){
        const i = (rowOff+x)*4;
        for(let c=0;c<3;c++){
          const v = src[i+c]*center + src[i+c-4]*side + src[i+c+4]*side + src[i+c-w*4]*side + src[i+c+w*4]*side;
          out[i+c] = v;
        }
      }
    }
    imgData.data.set(out);
    ctx.putImageData(imgData, 0, 0);
  }

  // ---------- MODE SWITCH ----------
  function setMode(m){
    mode = m;
    modePhotoBtn.classList.toggle('active', m==='photo');
    modeVideoBtn.classList.toggle('active', m==='video');
    photoTabs.style.display = m==='photo' ? 'flex' : 'none';
    videoTabs.style.display = m==='video' ? 'flex' : 'none';
    photoCanvas.style.display = (m==='photo' && img) ? 'block' : 'none';
    textLayer.style.display = (m==='photo' && img) ? 'block' : 'none';
    videoCanvas.style.display = (m==='video' && videoFile) ? 'block' : 'none';
    if(m!=='photo'){ exitCropMode(); }
    updateEmptyState();
    if(m==='photo'){ renderPhotoTab(photoTabs.querySelector('.ptab.active').dataset.tab); }
    else { renderVideoTab(videoTabs.querySelector('.vtab.active').dataset.tab); }
  }
  modePhotoBtn.onclick = ()=>setMode('photo');
  modeVideoBtn.onclick = ()=>setMode('video');

  function updateEmptyState(){
    const hasContent = mode==='photo' ? !!img : !!videoFile;
    emptyState.style.display = hasContent ? 'none' : 'flex';
    emptyLabel.textContent = mode==='photo' ? 'Drop in a photo to start editing' : 'Drop in a video to start editing';
    emptyPickBtn.textContent = mode==='photo' ? 'Choose Photo' : 'Choose Video';
    emptyPickBtn.setAttribute('for', mode==='photo' ? 'fileInput' : 'videoInput');
  }

  // ---------- PHOTO LOAD ----------
  fileInput.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = ()=>{
      img = im;
      originalImg = im;
      rotation=0; flipH=false; flipV=false;
      adjust = {brightness:100,contrast:100,saturate:100,blur:0,vignette:0,sharpen:0,dehaze:0,warmth:0,tint:0,grain:0,bloom:0,chroma:0,frame:'none'};
      activeFilter='none'; textNodes=[]; selectedTextId=null;
      exitCropMode();
      drawPhoto();
      renderTextNodes();
      photoCanvas.style.display='block';
      textLayer.style.display='block';
      updateEmptyState();
    };
    im.src = url;
  };

  function applyBloom(ctx, canvas, amount){
    if(!amount) return;
    const w = canvas.width, h = canvas.height;
    const tmp = document.createElement('canvas'); tmp.width=w; tmp.height=h;
    const tctx = tmp.getContext('2d');
    tctx.filter = `blur(${Math.max(2, amount/100*14)}px) brightness(1.3)`;
    tctx.drawImage(canvas,0,0);
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = Math.min(amount/100,1)*0.6;
    ctx.drawImage(tmp,0,0);
    ctx.restore();
  }

  function applyChromaticAberration(ctx, canvas, amount){
    if(!amount) return;
    const w = canvas.width, h = canvas.height;
    const offset = Math.round(amount/100*10);
    if(offset<1) return;
    const src = ctx.getImageData(0,0,w,h);
    const out = ctx.createImageData(w,h);
    const sd = src.data, od = out.data;
    for(let y=0;y<h;y++){
      const rowOff = y*w;
      for(let x=0;x<w;x++){
        const di = (rowOff+x)*4;
        const rx = Math.max(0, x-offset), bx = Math.min(w-1, x+offset);
        const ri = (rowOff+rx)*4, bi = (rowOff+bx)*4;
        od[di] = sd[ri];
        od[di+1] = sd[di+1];
        od[di+2] = sd[bi+2];
        od[di+3] = sd[di+3];
      }
    }
    ctx.putImageData(out,0,0);
  }

  function applyGrain(ctx, canvas, amount){
    if(!amount) return;
    const w = canvas.width, h = canvas.height;
    const imgData = ctx.getImageData(0,0,w,h);
    const d = imgData.data;
    const strength = amount/100*40;
    for(let i=0;i<d.length;i+=4){
      const n = (Math.random()-0.5)*strength;
      d[i]+=n; d[i+1]+=n; d[i+2]+=n;
    }
    ctx.putImageData(imgData,0,0);
  }

  function applyFrame(ctx, canvas, frameType){
    if(!frameType || frameType==='none') return;
    const w = canvas.width, h = canvas.height;
    const t = Math.round(Math.min(w,h)*0.04);
    ctx.save();
    if(frameType==='polaroid'){
      ctx.fillStyle = '#f5f2ea';
      ctx.fillRect(0,0,w,t);
      ctx.fillRect(0,h-t*2.4,w,t*2.4);
      ctx.fillRect(0,0,t,h);
      ctx.fillRect(w-t,0,t,h);
    } else {
      ctx.fillStyle = frameType==='white' ? '#ffffff' : '#000000';
      ctx.fillRect(0,0,w,t);
      ctx.fillRect(0,h-t,w,t);
      ctx.fillRect(0,0,t,h);
      ctx.fillRect(w-t,0,t,h);
    }
    ctx.restore();
  }

  function drawPhoto(){
    if(!img) return;
    const swap = (rotation%180!==0);
    const w = swap ? img.naturalHeight : img.naturalWidth;
    const h = swap ? img.naturalWidth : img.naturalHeight;
    // scale down for perf if huge
    const maxDim = 1600;
    const scale = Math.min(1, maxDim/Math.max(w,h));
    photoCanvas.width = w*scale;
    photoCanvas.height = h*scale;
    pctx.save();
    pctx.filter = filterCSSFromValues(adjust, activeFilter);
    pctx.translate(photoCanvas.width/2, photoCanvas.height/2);
    pctx.rotate(rotation*Math.PI/180);
    pctx.scale(flipH?-1:1, flipV?-1:1);
    const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
    pctx.drawImage(img, -dw/2, -dh/2, dw, dh);
    pctx.restore();
    applyVignette(pctx, photoCanvas, adjust.vignette);
    applyWarmthTint(pctx, photoCanvas, adjust.warmth, adjust.tint);
    applySharpen(pctx, photoCanvas, adjust.sharpen);
    applyBloom(pctx, photoCanvas, adjust.bloom);
    applyChromaticAberration(pctx, photoCanvas, adjust.chroma);
    applyGrain(pctx, photoCanvas, adjust.grain);
    applyFrame(pctx, photoCanvas, adjust.frame);
  }

  // ---------- CROP ----------
  let cropRect = null;
  function initCropBox(){
    if(!img) return;
    const stageRect = stage.getBoundingClientRect();
    const canvasRect = photoCanvas.getBoundingClientRect();
    const x = canvasRect.left - stageRect.left, y = canvasRect.top - stageRect.top;
    const w = canvasRect.width, h = canvasRect.height;
    const inset = 0.08;
    cropRect = { x: x + w*inset, y: y + h*inset, w: w*(1-2*inset), h: h*(1-2*inset) };
    updateCropBoxUI();
  }
  function updateCropBoxUI(){
    if(!cropRect) return;
    cropBoxEl.style.left = cropRect.x+'px';
    cropBoxEl.style.top = cropRect.y+'px';
    cropBoxEl.style.width = cropRect.w+'px';
    cropBoxEl.style.height = cropRect.h+'px';
  }
  function setCropAspect(ratio){
    if(ratio===null || !cropRect) return;
    const canvasRect = photoCanvas.getBoundingClientRect();
    const cx = cropRect.x + cropRect.w/2, cy = cropRect.y + cropRect.h/2;
    let w = cropRect.w, h = w/ratio;
    if(h > canvasRect.height*0.95){ h = canvasRect.height*0.85; w = h*ratio; }
    cropRect = { x: cx-w/2, y: cy-h/2, w, h };
    updateCropBoxUI();
  }
  let cropDragMode=null, cropDragStart=null, cropStartRect=null;
  function cropBounds(){
    const stageRect = stage.getBoundingClientRect();
    const canvasRect = photoCanvas.getBoundingClientRect();
    return {
      minX: canvasRect.left-stageRect.left, minY: canvasRect.top-stageRect.top,
      maxX: canvasRect.left-stageRect.left+canvasRect.width, maxY: canvasRect.top-stageRect.top+canvasRect.height
    };
  }
  cropBoxEl.addEventListener('pointerdown', e=>{
    if(e.target.classList.contains('crop-handle')) return;
    cropDragMode='move'; cropDragStart={x:e.clientX,y:e.clientY}; cropStartRect={...cropRect};
    cropBoxEl.setPointerCapture(e.pointerId);
  });
  cropBoxEl.querySelectorAll('.crop-handle').forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      cropDragMode = 'resize-'+h.dataset.corner;
      cropDragStart = {x:e.clientX,y:e.clientY}; cropStartRect = {...cropRect};
      h.setPointerCapture(e.pointerId);
    });
  });
  window.addEventListener('pointermove', e=>{
    if(!cropDragMode || !cropRect) return;
    const dx = e.clientX-cropDragStart.x, dy = e.clientY-cropDragStart.y;
    const b = cropBounds();
    if(cropDragMode==='move'){
      let nx = cropStartRect.x+dx, ny = cropStartRect.y+dy;
      nx = Math.max(b.minX, Math.min(nx, b.maxX-cropStartRect.w));
      ny = Math.max(b.minY, Math.min(ny, b.maxY-cropStartRect.h));
      cropRect = {...cropStartRect, x:nx, y:ny};
    } else {
      const corner = cropDragMode.split('-')[1];
      let x=cropStartRect.x, y=cropStartRect.y, x2=cropStartRect.x+cropStartRect.w, y2=cropStartRect.y+cropStartRect.h;
      if(corner.includes('w')) x = Math.min(cropStartRect.x+dx, x2-40);
      if(corner.includes('e')) x2 = Math.max(cropStartRect.x+cropStartRect.w+dx, x+40);
      if(corner.includes('n')) y = Math.min(cropStartRect.y+dy, y2-40);
      if(corner.includes('s')) y2 = Math.max(cropStartRect.y+cropStartRect.h+dy, y+40);
      x = Math.max(b.minX, x); y = Math.max(b.minY, y);
      x2 = Math.min(b.maxX, x2); y2 = Math.min(b.maxY, y2);
      cropRect = {x, y, w:x2-x, h:y2-y};
    }
    updateCropBoxUI();
  });
  window.addEventListener('pointerup', ()=>{ cropDragMode=null; });

  function applyCrop(){
    if(!cropRect || !img) return;
    const stageRect = stage.getBoundingClientRect();
    const canvasRect = photoCanvas.getBoundingClientRect();
    const scaleX = photoCanvas.width/canvasRect.width, scaleY = photoCanvas.height/canvasRect.height;
    const sx = (cropRect.x - (canvasRect.left - stageRect.left)) * scaleX;
    const sy = (cropRect.y - (canvasRect.top - stageRect.top)) * scaleY;
    const sw = cropRect.w*scaleX, sh = cropRect.h*scaleY;
    const out = document.createElement('canvas');
    out.width = Math.max(1,Math.round(sw)); out.height = Math.max(1,Math.round(sh));
    out.getContext('2d').drawImage(photoCanvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
    const dataUrl = out.toDataURL('image/png');
    const newImg = new Image();
    newImg.onload = ()=>{
      img = newImg;
      rotation=0; flipH=false; flipV=false;
      adjust = {brightness:100,contrast:100,saturate:100,blur:0,vignette:0,sharpen:0,dehaze:0,warmth:0,tint:0,grain:0,bloom:0,chroma:0,frame:'none'};
      activeFilter='none'; textNodes=[]; selectedTextId=null; renderTextNodes();
      drawPhoto();
      exitCropMode();
      photoTabs.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('active', x.dataset.tab==='adjust'));
      renderPhotoTab('adjust');
    };
    newImg.src = dataUrl;
  }
  function exitCropMode(){
    cropOverlay.classList.remove('active');
    cropRect = null;
  }

  function renderTextNodes(){
    textLayer.innerHTML = '';
    textNodes.forEach(n=>{
      const el = document.createElement('div');
      el.className = 'text-node' + (n.id===selectedTextId ? ' selected' : '');
      el.textContent = n.text;
      el.style.left = n.x+'px';
      el.style.top = n.y+'px';
      el.style.color = n.color;
      el.style.fontSize = n.size+'px';
      el.style.fontFamily = TEXT_FONTS[n.font] || TEXT_FONTS.display;
      el.dataset.id = n.id;
      let sx, sy, ox, oy, dragging=false, moved=false;
      el.addEventListener('pointerdown', e=>{
        dragging=true; moved=false; sx=e.clientX; sy=e.clientY; ox=n.x; oy=n.y; el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', e=>{
        if(!dragging) return;
        if(Math.abs(e.clientX-sx)>4 || Math.abs(e.clientY-sy)>4) moved=true;
        n.x = ox + (e.clientX-sx); n.y = oy + (e.clientY-sy);
        el.style.left=n.x+'px'; el.style.top=n.y+'px';
      });
      el.addEventListener('pointerup', ()=>{
        dragging=false;
        if(!moved && selectedTextId!==n.id){
          selectedTextId = n.id;
          renderTextNodes();
          if(photoTabs.querySelector('.ptab.active').dataset.tab==='text') renderPhotoTab('text');
        }
      });
      el.addEventListener('dblclick', ()=>openTextEditor(n));
      textLayer.appendChild(el);
    });
  }

  function setupTrimHandles(){
    const wrap = panelHost.querySelector('.trim-wrap');
    const hs = $('#handleStart'), he = $('#handleEnd'), shL = $('#shadeL'), shR = $('#shadeR');
    function layout(){
      const w = wrap.clientWidth;
      const xs = (trimStart/duration)*w, xe = (trimEnd/duration)*w;
      hs.style.left = xs+'px';
      he.style.left = Math.max(xs+14, xe-14)+'px';
      shL.style.left='0'; shL.style.width = xs+'px';
      shR.style.right='0'; shR.style.width = (w-xe)+'px';
      $('#trimStartVal').textContent = fmtTime(trimStart);
      $('#trimEndVal').textContent = fmtTime(trimEnd);
    }
    layout();
    function dragHandle(handle, isStart){
      handle.addEventListener('pointerdown', e=>{
        handle.setPointerCapture(e.pointerId);
        function move(ev){
          const rect = wrap.getBoundingClientRect();
          let frac = (ev.clientX-rect.left)/rect.width;
          frac = Math.max(0, Math.min(1, frac));
          const t = frac*duration;
          if(isStart){ trimStart = Math.min(t, trimEnd-0.2); videoEl.currentTime=trimStart; }
          else { trimEnd = Math.max(t, trimStart+0.2); }
          layout();
        }
        function up(){ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); }
        window.addEventListener('pointermove',move);
        window.addEventListener('pointerup',up);
      });
    }
    dragHandle(hs, true);
    dragHandle(he, false);
  }

  };

  // ---------- EXPORT ----------
  $('#exportBtn').onclick = ()=>{
    if(mode==='photo'){
      if(!img) return;
      exportPhoto();
    } else {
      if(!videoFile) return;
      exportVideo();
    }
  };

  function exportPhoto(){
    // bake text nodes onto a copy canvas at native resolution
    const out = document.createElement('canvas');
    out.width = photoCanvas.width; out.height = photoCanvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(photoCanvas, 0, 0);
    // map text node screen coords -> canvas coords
    const rect = photoCanvas.getBoundingClientRect();
    const scaleX = photoCanvas.width/rect.width, scaleY = photoCanvas.height/rect.height;
    textNodes.forEach(n=>{
      octx.font = `800 ${n.size*scaleX}px ${TEXT_FONTS[n.font] || TEXT_FONTS.display}`;
      octx.fillStyle = n.color;
      octx.textBaseline = 'top';
      octx.shadowColor = 'rgba(0,0,0,.5)';
      octx.shadowBlur = 8;
      const localX = (n.x - rect.left) * scaleX;
      const localY = (n.y - rect.top) * scaleY;
      octx.fillText(n.text, localX, localY);
    });
    out.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'aurelius-edit.png';
      document.body.appendChild(a); a.click(); a.remove();
    }, 'image/png');
  }

  function exportVideo(){
    if(!('MediaRecorder' in window)){ alert('Video export is not supported in this browser.'); return; }
    toast('Rendering video…', true);
    const canvasStream = videoCanvas.captureStream(30);
    let combinedStream = canvasStream;
    if(!muteAudio && videoEl.captureStream){
      try{
        const srcStream = videoEl.captureStream();
        const audioTracks = srcStream.getAudioTracks();
        if(audioTracks.length){
          combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);
        }
      }catch(e){ /* audio capture unsupported here; falls back to video-only */ }
    }
    const candidates = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    let mimeType = candidates.find(c=>MediaRecorder.isTypeSupported(c)) || 'video/webm';
    const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
    const chunks = [];
    const rec = new MediaRecorder(combinedStream, {mimeType});
    rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop = ()=>{
      toast('', false);
      const blob = new Blob(chunks, {type: mimeType.split(';')[0]});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'aurelius-edit.'+ext;
      document.body.appendChild(a); a.click(); a.remove();
      videoEl.playbackRate = playbackRate;
    };
    videoEl.pause();
    videoEl.currentTime = trimStart;
    videoEl.playbackRate = playbackRate;
    const onSeeked = ()=>{
      videoEl.removeEventListener('seeked', onSeeked);
      rec.start();
      videoEl.play();
      const check = setInterval(()=>{
        if(videoEl.currentTime >= trimEnd || videoEl.paused){
          clearInterval(check);
          rec.stop();
          videoEl.pause();
        }
      }, 100);
    };
    videoEl.addEventListener('seeked', onSeeked);
  }

  // init
  updateEmptyState();
})();
</script>
</body>
</html>
